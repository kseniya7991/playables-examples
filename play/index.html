<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Play — Playable Ads Portfolio</title>
  <meta property="og:title" content="Playable Ads Portfolio — Kseniya Stoichykava">
  <meta property="og:image" content="/assets/og.png">
  <meta name="theme-color" content="#0b0b14">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/games.js"></script>
</head>
<body>
<div class="player">
  <!-- left: games list -->
  <aside class="side">
    <div class="topbar">
      <a class="brand" href="/">
        <span class="brand-dot"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></span>
        <span id="author"></span>
      </a>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ru">RU</button>
      </div>
    </div>
    <nav class="list" id="list"></nav>
  </aside>

  <!-- center: device with the game -->
  <section class="stage">
    <div class="stage-bar">
      <a class="back desk-only" href="/"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backTxt"></span></a>
      <a class="icon-btn mobile-only" href="/" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>

      <div class="tools">
        <button class="icon-btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="counter desk-only" id="counter"></span>
        <span class="title-m mobile-only" id="titleM"></span>
        <button class="icon-btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

      <div class="tools">
        <span class="tools desk-only" id="modes">
          <button class="icon-btn" data-mode="portrait" title="Portrait"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/></svg></button>
          <button class="icon-btn" data-mode="landscape" title="Landscape"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/></svg></button>
          <button class="icon-btn" data-mode="free" title="Fit window"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </span>
        <button class="icon-btn" id="reload" title="Restart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
        <a class="icon-btn desk-only" id="newTab" target="_blank" rel="noopener" title="Open in new tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      </div>
    </div>

    <div class="device-wrap" id="wrap">
      <div class="device" id="device">
        <iframe id="frame" title="Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
        <div class="loader" id="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- right: description -->
  <aside class="info">
    <div>
      <div class="genre" id="genre"></div>
      <h1 id="title"></h1>
    </div>
    <p id="desc"></p>
    <div>
      <h4 id="stackTitle"></h4>
      <div class="chips" id="stack"></div>
    </div>
    <div class="hint" id="hint"></div>
  </aside>
</div>

<script>
(function () {
  const P = window.PORTFOLIO, G = P.games, t = pfT;
  const $ = (id) => document.getElementById(id);
  const L = {
    back: { en: "All games", ru: "Все игры" },
    stack: { en: "Tech stack", ru: "Технологии" },
    hint: {
      en: 'Tap or click inside the game to play — sound starts after the first interaction.<br><br><kbd>←</kbd> <kbd>→</kbd> switch games · <kbd>R</kbd> restart',
      ru: 'Нажмите внутри игры, чтобы начать — звук включается после первого действия.<br><br><kbd>←</kbd> <kbd>→</kbd> переключение игр · <kbd>R</kbd> перезапуск',
    },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let idx = 0, mode = null;
  const slugIdx = () => Math.max(0, G.findIndex((g) => g.slug === location.hash.slice(1)));

  // ── size the device frame to fit the stage ──
  const RATIO = { portrait: 390 / 844, landscape: 844 / 390 };
  function layout() {
    const d = $("device"), w = $("wrap");
    if (matchMedia("(max-width: 760px)").matches) { d.style.width = d.style.height = ""; return; }
    const cs = getComputedStyle(w);
    const aw = w.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = w.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    d.classList.toggle("free", mode === "free");
    if (mode === "free") { d.style.width = aw + "px"; d.style.height = ah + "px"; return; }
    const pad = 24 + 18; // device padding + outer ring
    const r = RATIO[mode];
    let h = Math.min(ah - pad, mode === "portrait" ? 844 : 600), wd = h * r;
    if (wd > aw - pad) { wd = aw - pad; h = wd / r; }
    d.style.width = wd + 24 + "px";
    d.style.height = h + 24 + "px";
  }
  function setMode(m) {
    mode = m;
    document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
    layout();
  }

  function loadGame() {
    const g = G[idx];
    $("loader").classList.remove("hide");
    $("frame").src = "/games/" + g.slug + "/index.html";
    $("newTab").href = "/games/" + g.slug + "/index.html";
    setMode(g.orientation || "portrait");
    renderText();
    const a = document.querySelector(`#list a[data-i="${idx}"]`);
    if (a) a.scrollIntoView({ block: "nearest" });
  }
  $("frame").addEventListener("load", () => {
    setTimeout(() => $("loader").classList.add("hide"), 250);
  });

  function renderText() {
    const g = G[idx], lang = pfLang();
    document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
    document.title = g.title + " — " + P.author;
    $("author").textContent = P.author;
    $("backTxt").textContent = t(L.back);
    $("counter").textContent = String(idx + 1).padStart(2, "0") + " / " + String(G.length).padStart(2, "0");
    $("titleM").textContent = g.title;
    $("genre").textContent = t(g.genre);
    $("title").textContent = g.title;
    $("desc").textContent = t(g.desc);
    $("stackTitle").textContent = t(L.stack);
    $("stack").innerHTML = g.stack.map((s) => `<span class="chip">${esc(s)}</span>`).join("");
    $("hint").innerHTML = t(L.hint);
    $("list").innerHTML = G.map((x, i) => `
      <a href="#${x.slug}" data-i="${i}" class="${i === idx ? "on" : ""}">
        <img src="/assets/covers/${x.slug}.webp" alt="">
        <span><b>${esc(x.title)}</b><small>${esc(t(x.genre))}</small></span>
      </a>`).join("");
  }

  const go = (d) => { location.hash = G[(idx + d + G.length) % G.length].slug; };
  window.addEventListener("hashchange", () => { idx = slugIdx(); loadGame(); });
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("reload").onclick = () => loadGame();
  document.querySelectorAll("#modes button").forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => pfSetLang(b.dataset.lang)));
  document.addEventListener("pf-lang", renderText);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "r" || e.key === "R" || e.key === "к" || e.key === "К") loadGame();
  });
  window.addEventListener("resize", layout);

  idx = slugIdx();
  if (!location.hash) history.replaceState(null, "", "#" + G[idx].slug);
  loadGame();
})();
</script>
</body>
</html>
