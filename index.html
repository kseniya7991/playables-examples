<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playable ads — примеры</title>
  <meta property="og:title" content="Playable ads — примеры">
  <meta property="og:image" content="assets/og.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111116; color: #ececf1; font-family: Manrope, system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 1100px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 26px; font-weight: 700; }
    .sub { color: #8d8d9c; margin-top: 6px; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 24px 18px; margin-top: 32px; }
    .card { color: inherit; text-decoration: none; display: block; }
    .cover { aspect-ratio: 390 / 640; border-radius: 14px; overflow: hidden; background: #1c1c24; border: 1px solid #26262f; transition: transform .2s, border-color .2s; }
    .cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .card:hover .cover { transform: translateY(-3px); border-color: #4a4a5a; }
    .name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 12px; font-weight: 700; font-size: 16px; }
    .name span { color: #8d8d9c; font-size: 15px; }
    .card:hover .name span { color: #ececf1; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tags span { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #1f1f28; color: #b4b4c2; }
    @media (max-width: 480px) {
      main { padding-top: 32px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
    }
  </style>
</head>
<body>
<main>
  <h1>Playable ads</h1>
  <p class="sub">Несколько моих демо. Нажмите на игру, чтобы открыть её.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  // Список игр: папка в games/, название, технологии
  const GAMES = [
    { slug: "tropicana",    title: "Tropicana",         stack: ["PixiJS 8", "Spine", "@pixi/sound", "Vite"] },
    { slug: "tower-rush",   title: "Tower Rush",        stack: ["PixiJS 8", "Spine", "GSAP", "Howler", "Vite"] },
    { slug: "goose-bang",   title: "Goose Bang",        stack: ["PixiJS 8", "Spine", "Howler", "Vite"] },
    { slug: "crime-empire", title: "Crime Empire",      stack: ["JavaScript", "HTML / CSS"] },
    { slug: "balloon",      title: "Balloon Explosion", stack: ["JavaScript", "HTML / CSS"] },
  ];

  document.getElementById("grid").innerHTML = GAMES.map(g => `
    <a class="card" href="games/${g.slug}/index.html" target="_blank" rel="noopener">
      <div class="cover"><img src="assets/covers/${g.slug}.webp" alt="${g.title}" loading="lazy"></div>
      <div class="name">${g.title}<span>↗</span></div>
      <div class="tags">${g.stack.map(s => `<span>${s}</span>`).join("")}</div>
    </a>`).join("");
</script>
</body>
</html>
