<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Game</title>
		<link href="css/main.min.css" rel="stylesheet">
	</head>
	<body>
		<div class="game js-game " data-phase="waiting" data-delay="5000">
			<div class="game__container">
				<div class="game__main">
					<div class="game__bg"></div>
					<button class="game__music-controller js-game__music-control"></button>
					<div class="parallax">
						<div class="layer layer-1"></div>
						<div class="layer layer-2"></div>
						<div class="layer layer-3"></div>
						<div class="layer layer-4"></div>
						<div class="layer layer-5"></div>
						<div class="layer layer-6"></div>
					</div>
					<div class="game__robber"></div>
					<div class="game__preloader js-game__preloader">
						Aguardando a próxima rodada
						<div class="game__progress js-game__progress">
							<span class="game__progress-bar"></span>
						</div>
					</div>
					<div class="game__score js-game__score hiding">x
						<span class="js-game__score-value">1.01</span>
					</div>
					<div class="game__cashout js-game__cashout-modal">
						<img src="assets/win.png" alt="">
						<div class="game__cashout-row">
							<div class="game__cashout-result">
								<span class="js-game__cashout-result">12345</span>
								R$
							</div>
							<span class="game__cashout-mult js-game__cashout-mult">2.00x</span>
						</div>
						<div class="game__cashout-btns">
							<button class="game__btn game__btn--secondary js-game__play">Jogar mais</button>
							<button class="game__btn game__btn--primary">Com dinheiro real</button>
						</div>
					</div>
				</div>
			</div>
			<div class="game__controls">
				<div class="control js-game__control-item">
					<div class="control__left">
						<div class="control__autowithdrawal">
							<label class="control__autocashout control__switch">
								<input type="checkbox" class="control__autocashout-checkbox control__switch-input js-game__autocashout">
								Saque auto
							</label>
							<label class="control__autocashout-field">
								x
								<input pattern="\d*(\s|\d)*(\.|,)?\d?\d?" type="text" inputmode="decimal" class="control__autocashout-input js-game__autocashout-value" value="2.00">
								<span class="control__measurer js-game__measurer">2.00</span>
							</label>
						</div>
						<div class="control__bets js-game__controller">
							<div class="control__bet-field ">
								<label class="control__bet-label">
									<input type="text" inputmode="decimal" class="control__bet-input js-game__controller-input" value="0.2" data-max="150" data-min="0.1">
									<span class="control__measurer js-game__measurer">0.2</span>
									$
								</label>
								<button class="control__bet-down js-game__controller-minus"></button>
								<button class="control__bet-up js-game__controller-plus"></button>
							</div>
							<div class="control__bet-btns">
								<button class="control__bet-btn js-game__controller-bet" data-value="1">1</button>
								<button class="control__bet-btn js-game__controller-bet" data-value="2">2</button>
								<button class="control__bet-btn js-game__controller-bet" data-value="5">5</button>
							</div>
						</div>
					</div>
					<div class="control__right">
						<div class="control__right-wrap-top">
							<label class="control__autobet control__switch">
								<input type="checkbox" class="control__autobet-checkbox control__switch-input js-game__autobet">
								Aposta auto
							</label>
						</div>
						<div class="control__right-wrap-bottom">
							<button class="control__action js-game__bet" data-phase="bet">
								<div class="control__action-wait">
									AGUARDANDO
								</div>
								<div class="control__action-bet">
									APOSTA
									<img src="assets/money.png" alt="">
								</div>
								<div class="control__action-cancel">
									CANCELAR
								</div>
								<div class="control__action-cashout">
									Retirar
									<div class="control__action-result">
										<span class="control__action-sum js-game__bet-value">
											0.5
										</span>
										R$
									</div>
								</div>
							</button>
						</div>
					</div>
				</div>
				<div class="control js-game__control-item">
					<div class="control__left">
						<div class="control__autowithdrawal">
							<label class="control__autocashout control__switch">
								<input type="checkbox" class="control__autocashout-checkbox control__switch-input js-game__autocashout">
								Saque auto
							</label>
							<label class="control__autocashout-field">
								x
								<input pattern="\d*(\s|\d)*(\.|,)?\d?\d?" type="text" inputmode="decimal" class="control__autocashout-input js-game__autocashout-value" value="2.00">
								<span class="control__measurer js-game__measurer">2.00</span>
							</label>
						</div>
						<div class="control__bets js-game__controller">
							<div class="control__bet-field ">
								<label class="control__bet-label">
									<input type="text" inputmode="decimal" class="control__bet-input js-game__controller-input" value="0.2" data-max="150" data-min="0.1">
									<span class="control__measurer js-game__measurer">0.2</span>
									$
								</label>
								<button class="control__bet-down js-game__controller-minus"></button>
								<button class="control__bet-up js-game__controller-plus"></button>
							</div>
							<div class="control__bet-btns">
								<button class="control__bet-btn js-game__controller-bet" data-value="1">1</button>
								<button class="control__bet-btn js-game__controller-bet" data-value="2">2</button>
								<button class="control__bet-btn js-game__controller-bet" data-value="5">5</button>
							</div>
						</div>
					</div>
					<div class="control__right">
						<div class="control__right-wrap-top">
							<label class="control__autobet control__switch">
								<input type="checkbox" class="control__autobet-checkbox control__switch-input js-game__autobet">
								Aposta auto
							</label>
						</div>
						<div class="control__right-wrap-bottom">
							<button class="control__action js-game__bet" data-phase="bet">
								<div class="control__action-wait">
									AGUARDANDO
								</div>
								<div class="control__action-bet">
									APOSTA
									<img src="assets/money.png" alt="">
								</div>
								<div class="control__action-cancel">
									CANCELAR
								</div>
								<div class="control__action-cashout">
									Retirar
									<div class="control__action-result">
										<span class="control__action-sum js-game__bet-value">
											0.5
										</span>
										R$
									</div>
								</div>
							</button>
						</div>
					</div>
				</div>
			
				
			</div>
			<div class="game__final js-game__final">
				<div class="game__final-content">
					A demonstração está finalizada. Agora é hora de jogar com dinheiro real. Cadastre-se, faça um depósito e ganhe um super bônus de 150%:
					<a href="#">PLAY</a>
				</div>
			</div>
		</div>
		<script src="js/main.min.js"></script>
	</body>
</html>
